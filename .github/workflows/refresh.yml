name: Refresh CTSU accrual

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Snapshot CTSU and rebuild the dashboard
        env:
          FIREBASE_WEB_CONFIG: ${{ vars.FIREBASE_WEB_CONFIG }}
        run: python scripts/refresh.py

      - name: Commit history and public page
        run: |
          git config user.name "ctsu-refresh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/accrual_history.csv docs/index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Accrual snapshot $(date -u +%F)"
            git push
          fi
